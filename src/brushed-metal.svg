<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".016 .57" numOctaves="3" seed="38" stitchTiles="stitch"/>
    <feColorMatrix values=".61 0 0 0 .195
                           .61 0 0 0 .195
                           .61 0 0 0 .195
                           0 0 0 0 1"/>
  </filter>
  <filter id="brush" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".006 .24" numOctaves="2" seed="12" stitchTiles="stitch"/>
    <feColorMatrix values=".7 0 0 0 .15
                           .7 0 0 0 .15
                           .7 0 0 0 .15
                           0 0 0 0 1"/>
  </filter>
  <rect width="1024" height="512" filter="url(#grain)"/>
  <rect width="1024" height="512" filter="url(#brush)" opacity=".24"/>
</svg>
