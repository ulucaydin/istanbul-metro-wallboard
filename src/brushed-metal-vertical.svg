<svg xmlns="http://www.w3.org/2000/svg" width="512" height="1024" viewBox="0 0 512 1024">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".57 .016" numOctaves="3" seed="38" stitchTiles="stitch"/>
    <feColorMatrix values=".61 0 0 0 .195
                           .61 0 0 0 .195
                           .61 0 0 0 .195
                           0 0 0 0 1"/>
  </filter>
  <filter id="brush" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".24 .006" numOctaves="2" seed="12" stitchTiles="stitch"/>
    <feColorMatrix values=".7 0 0 0 .15
                           .7 0 0 0 .15
                           .7 0 0 0 .15
                           0 0 0 0 1"/>
  </filter>
  <rect width="512" height="1024" filter="url(#grain)"/>
  <rect width="512" height="1024" filter="url(#brush)" opacity=".24"/>
</svg>
